[workspace]
members = [
    "crates/ai",
    "crates/compat",
    "crates/engine",
    "crates/rules",
    "crates/server",
    "crates/test-oracle",
    "crates/tools",
    "crates/wasm-api",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MPL-2.0"

[workspace.dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["http2", "json", "macros", "ws"] }
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
indexmap = { version = "2.11", features = ["serde"] }
proptest = "1.7"
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1.0"
sha2 = "0.11"
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio-rustls", "uuid"] }
tempfile = "3.20"
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.18", features = ["serde"] }
wasm-bindgen = "0.2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
